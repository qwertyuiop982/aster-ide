<!doctype html>
<html lang="{{html_lang}}" {{language_attrs}}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>{{title}}</title>
  <meta name="description" content="{{meta_description}}">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{meta_description}}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{canonical_url}}">
  <meta property="og:locale" content="{{og_locale}}">
  <link rel="canonical" href="{{canonical_url}}">
  {{alternate_links}}
  <link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
  <script src="/assets/language.js?v={{asset_version}}"></script>
  <link rel="stylesheet" href="/assets/site.css?v={{asset_version}}">
  <script src="/assets/site.js?v={{asset_version}}" defer></script>
</head>
<body class="home-page">
  <a class="skip" href="#main">{{skip}}</a>
  <div class="home-shell">
    <header class="home-header interface">{{language_switch}}<button type="button" id="theme-toggle" class="theme-toggle" aria-label="{{theme_light_label}}" aria-pressed="false" data-theme-toggle data-light-label="{{theme_light_label}}" data-dark-label="{{theme_dark_label}}" title="{{theme_light_label}}"><svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg><svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 15.2A8.5 8.5 0 0 1 8.8 3.5 8.5 8.5 0 1 0 20.5 15.2Z"/></svg></button></header>
    <div id="phone-stage" class="phone-stage" role="group" tabindex="0" aria-label="{{scene_label}}" aria-describedby="scene-instructions" data-scene="loading">
      <div class="phone-poster" aria-hidden="true">
        <div class="poster-phone poster-xiaomi"><img src="/assets/screens/xiaomi.svg" alt="" width="360" height="800"></div>
        <div class="poster-phone poster-huawei"><span class="poster-camera"></span></div>
        <div class="poster-phone poster-samsung"><span class="poster-camera"></span></div>
        <div class="poster-phone poster-pixel"><img src="/assets/screens/pixel.svg" alt="" width="360" height="800"></div>
      </div>
    </div>
    <main id="main" class="hero interface">
      <h1>Aster</h1>
      <a class="download-button" href="{{apk_url}}" aria-label="{{download_aster}} v{{version}} ({{apk_size}})">{{download_short}}<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 17v4h14v-4"/></svg></a>
    </main>
    <p id="scene-instructions" class="visually-hidden">{{scene_instructions}}</p>
    <div class="scene-controls interface" aria-label="{{scene_controls}}">
      <button type="button" id="motion-toggle" aria-label="{{pause_rotation}}" aria-pressed="false" data-pause-label="{{pause_rotation}}" data-play-label="{{play_rotation}}" title="{{pause_rotation}}"><svg class="pause-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M7 5h3v14H7zm7 0h3v14h-3z"/></svg><svg class="play-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="m8 5 11 7-11 7z"/></svg></button>
      <button type="button" id="scene-reset" aria-label="{{reset_view}}" title="{{reset_view}}"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1 8M4 4v6h6"/></svg></button>
    </div>
    <footer class="home-footer interface"><nav class="footer-links" aria-label="{{footer_label}}">{{footer_links}}</nav></footer>
  </div>
</body>
</html>
